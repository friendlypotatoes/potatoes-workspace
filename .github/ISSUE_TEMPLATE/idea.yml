name: Idea or feedback
description: A change to an existing skill or workflow, grounded in a failure you saw. One change per issue.
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        An idea stays open only if it clears both parts of the bar:

        1. **Observed failure**: it describes something that went wrong in a real session, not a hypothetical improvement.
        2. **Fits the findings**: it does not contradict `docs/FINDINGS.md`, and it is not a personal-workflow tweak.

        Ground the change in the session where the skill fell short.
  - type: checkboxes
    id: read-scope
    attributes:
      label: Before filing
      options:
        - label: I've read `docs/FINDINGS.md` and this isn't already settled there.
          required: true
        - label: This issue is about one problem.
          required: true
        - label: I searched open and closed issues for a duplicate.
          required: true
  - type: input
    id: skill
    attributes:
      label: Skill or workflow
      description: Which existing skill, script or workflow doc this changes.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What went wrong
      description: The real session where it fell short. What you ran, what it did, and why that was a problem. Include harness and model.
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: Proposed change
      description: The smallest change that fixes it. Describe it; don't paste a rewritten SKILL.md.
    validations:
      required: true
